# Phục vụ bản build của web và chuyển tiếp /api, /iot tới API Gateway trong mạng compose.
# Trình duyệt chỉ nói chuyện với một địa chỉ (cùng origin), nên không cần CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;            # khớp MAX_BODY_BYTES của Gateway (ảnh camera tối đa 1,5 MB)
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Chỉ nạp tài nguyên cùng origin. img-src có blob: vì ảnh camera cần JWT nên được tải thành blob rồi mới hiển thị.
    # style-src có 'unsafe-inline' vì biểu đồ (Recharts) gắn style trực tiếp lên phần tử.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API và Swagger của từng service (/api/core/docs...), cùng thiết bị IoT (/iot/telemetry, /iot/snapshot).
    location ~ ^/(api|iot)/ {
        # Dùng biến + resolver của Docker để nginx vẫn khởi động khi Gateway chưa sẵn sàng và tự tìm lại IP khi Gateway khởi động lại.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://gateway:8000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;         # Gateway chờ service phía sau tối đa 30 giây
    }

    # Tệp có băm nội dung trong tên: cache lâu, đổi bản là đổi tên.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Mọi đường dẫn còn lại là route của React (đổi trang không tải lại từ server).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
