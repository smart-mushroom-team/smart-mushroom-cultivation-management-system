name: mushroom

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET}
  SERVICE_KEY: ${SERVICE_KEY}
  DEMO_MODE: ${DEMO_MODE:-false}

services:
  # ---------------- hạ tầng ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
      NIFI_DB_PASSWORD: ${NIFI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitdata:/var/lib/rabbitmq
    ports: ["15672:15672"]          # UI quản trị (xem khi demo)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # chỉ dữ liệu dựng lại được (BR-20)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 128m } } }

  nifi:
    image: apache/nifi:1.27.0
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    ports: ["8443:8443"]
    volumes:
      - ./infra/nifi/drivers:/opt/nifi/nifi-current/drivers:ro      # đặt postgresql-*.jar vào đây
      - nifidata:/opt/nifi/nifi-current/conf
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1536m } } }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ---------------- dịch vụ ứng dụng ----------------
  identity:
    build: { context: ., dockerfile: services/identity/Dockerfile }
    environment:
      <<: *service-env
      ROOT_PATH: /api/identity
      DB_USER: identity_user
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      DB_NAME: identity_db
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  core:
    build: { context: ., dockerfile: services/core/Dockerfile }
    environment:
      <<: *service-env
      ROOT_PATH: /api/core
      DB_USER: core_user
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      DB_NAME: core_db
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE}
      FCM_DRY_RUN: ${FCM_DRY_RUN:-true}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  monitoring:
    build: { context: ., dockerfile: services/monitoring/Dockerfile }
    environment:
      <<: *service-env
      ROOT_PATH: /api/monitoring
      DB_USER: monitoring_user
      DB_PASSWORD: ${MONITORING_DB_PASSWORD}
      DB_NAME: monitoring_db
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CORE_URL: http://core:8000
      SNAPSHOT_DIR: /data/snapshots
      SNAPSHOT_RETENTION_HOURS: ${SNAPSHOT_RETENTION_HOURS:-24}     # giữ lịch sử ảnh camera bao lâu
    volumes:
      - snapshots:/data/snapshots           # file ảnh camera; metadata nằm ở bảng camera_snapshots (monitoring_db)
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    environment:
      <<: *service-env
      IDENTITY_URL: http://identity:8000
      CORE_URL: http://core:8000
      MONITORING_URL: http://monitoring:8000
      UPSTREAM_TIMEOUT_SECONDS: 30
      MAX_BODY_BYTES: 2097152       # 2 MB (snapshot)
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3001"
    ports: ["${GATEWAY_PORT:-8000}:8000"]   # cổng duy nhất của ứng dụng mở ra mạng
    depends_on: [identity, core, monitoring]

volumes:
  pgdata:
  rabbitdata:
  nifidata:
  snapshots:
