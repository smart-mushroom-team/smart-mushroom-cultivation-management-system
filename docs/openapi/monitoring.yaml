openapi: 3.0.3
info:
  title: Monitoring Service API
  version: 0.1.0-draft
  description: |
    Quản lý thiết bị (camera, cảm biến), nhận dữ liệu từ thiết bị, hiển thị camera/môi trường, ngưỡng và cảnh báo.
    **BẢN NHÁP** để nhóm và web/mobile thống nhất hợp đồng API.

    Có **hai nhóm giao diện**:
    1. **Người dùng** (web/mobile): `http://localhost:8080/api/monitoring/...`, cần `Authorization: Bearer <JWT>`.
    2. **Thiết bị** (ESP32/Camera Agent): `http://localhost:8080/iot/...`, **không** dùng JWT mà dùng `X-Device-Key`.

    **Quyền xem camera/môi trường theo phòng (BR-08):** STAFF xem mọi phòng; `CUSTOMER` chỉ xem phòng mà mình có khay
    thuộc đơn `ACTIVE` còn hạn. Monitoring hỏi Core ở mỗi request và **fail-closed**: Core không trả lời được thì
    từ chối với `503 ACCESS_CHECK_UNAVAILABLE`, không bao giờ cho qua.

    **Trạng thái kết nối:** thiết bị `OFFLINE` khi quá 3 chu kỳ gửi không có dữ liệu (BR-11). Dữ liệu từ thiết bị
    giả lập mang cờ `isSimulated = true`, UI hiển thị nhãn "Mô phỏng".

    Phân trang và format lỗi giống các service khác.
servers:
  - url: http://localhost:8080/api/monitoring
    description: Qua API Gateway (dùng cái này)
  - url: http://localhost:3003
    description: Gọi thẳng Monitoring (chỉ để debug)
tags:
  - name: Devices
    description: STAFF quản lý thiết bị
  - name: RoomView
    description: Xem camera và số liệu môi trường của phòng
  - name: Thresholds
    description: Ngưỡng cảnh báo theo phòng
  - name: IoT
    description: Giao diện dành cho thiết bị (X-Device-Key), đường dẫn bắt đầu bằng /iot
security:
  - bearerAuth: []
paths:
  # ===================== DEVICES =====================
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: Danh sách thiết bị — STAFF
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: roomId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/DeviceType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeviceStatus' }
        - name: connectionState
          in: query
          schema: { $ref: '#/components/schemas/ConnectionState' }
      responses:
        '200':
          description: Trang thiết bị.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Devices]
      operationId: createDevice
      summary: Đăng ký thiết bị (FR-27) — STAFF
      description: |
        Mỗi phòng tối đa **một** thiết bị `ACTIVE` cho mỗi loại (BR-09). Hệ thống sinh API key,
        **trả plaintext đúng một lần** trong response này; chỉ lưu băm SHA-256.
        Thiết bị mới ở trạng thái `ACTIVE` + `OFFLINE` cho tới khi gửi dữ liệu lần đầu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceRequest' }
      responses:
        '201':
          description: Thiết bị đã tạo kèm API key (xem một lần).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateDeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Phòng đã có thiết bị ACTIVE cùng loại (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/summary:
    get:
      tags: [Devices]
      operationId: getDevicesSummary
      summary: Tổng hợp tình trạng thiết bị cho dashboard (FR-44) — STAFF
      responses:
        '200':
          description: Số thiết bị ACTIVE theo loại và trạng thái kết nối.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Chi tiết thiết bị — STAFF
      responses:
        '200':
          description: Thiết bị.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Sửa tên / chu kỳ gửi (FR-40) — STAFF
      description: Không đổi được `roomId` (BR-09). Muốn chuyển phòng thì vô hiệu hóa rồi đăng ký thiết bị mới.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeviceRequest' }
      responses:
        '200':
          description: Thiết bị sau cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: activateDevice
      summary: Kích hoạt lại thiết bị (FR-28) — STAFF
      description: Chuyển `INACTIVE → ACTIVE`, bắt đầu ở `OFFLINE`. Vi phạm BR-09 (đã có thiết bị ACTIVE cùng loại) thì `CONFLICT`.
      responses:
        '200':
          description: Thiết bị sau khi kích hoạt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: deactivateDevice
      summary: Vô hiệu hóa thiết bị (FR-28) — STAFF
      description: Đặt `INACTIVE` + `OFFLINE`, **không** phát cảnh báo mất kết nối. Không xóa thiết bị (BR-15).
      responses:
        '200':
          description: Thiết bị sau khi vô hiệu hóa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{id}/rotate-key:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: rotateDeviceKey
      summary: Cấp lại API key (FR-29, mức S) — STAFF
      description: Khóa cũ mất hiệu lực ngay. Khóa mới chỉ hiện một lần trong response này.
      responses:
        '200':
          description: API key mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateKeyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================== ROOM VIEW =====================
  /rooms/{roomId}/camera:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [RoomView]
      operationId: getRoomCamera
      summary: Thông tin camera của phòng (FR-34, FR-39)
      description: |
        Metadata để app biết có ảnh mới chưa và hiển thị trạng thái (`ONLINE`/`OFFLINE`, "Mô phỏng", thời điểm chụp).
        Phòng chưa có camera → `404`. Quyền xem: xem mô tả đầu tài liệu (BR-08).
      responses:
        '200':
          description: Thông tin camera.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CameraInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{roomId}/camera/snapshot:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [RoomView]
      operationId: getRoomSnapshot
      summary: Ảnh snapshot mới nhất (FR-34)
      description: |
        Trả **trực tiếp ảnh JPEG** (mobile/web tải bằng `Image.network` kèm header `Authorization`).
        Header `X-Captured-At` cho biết thời điểm chụp. Camera `OFFLINE` vẫn trả ảnh cuối cùng kèm
        header `X-Device-Connection-State: OFFLINE` để UI hiện cảnh báo "ảnh cũ". Chưa có ảnh nào → `404`.
        Client làm mới theo chu kỳ (mặc định 10 giây), đây là snapshot, không phải video.
      responses:
        '200':
          description: Ảnh JPEG.
          headers:
            X-Captured-At:
              description: Thời điểm chụp (ISO 8601).
              schema: { type: string, format: date-time }
            X-Device-Connection-State:
              description: Trạng thái kết nối camera tại thời điểm trả ảnh.
              schema: { $ref: '#/components/schemas/ConnectionState' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{roomId}/sensor/latest:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [RoomView]
      operationId: getRoomSensorLatest
      summary: Nhiệt độ / độ ẩm mới nhất (FR-34)
      description: Phòng chưa có số liệu → `reading = null` (không phải lỗi). Kèm trạng thái cảm biến và trạng thái từng chỉ số.
      responses:
        '200':
          description: Số liệu mới nhất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorLatest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{roomId}/sensor/readings:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [RoomView]
      operationId: getRoomSensorReadings
      summary: Biểu đồ nhiệt độ / độ ẩm (FR-35)
      description: Lịch sử trong 1 giờ hoặc 24 giờ gần nhất, rút gọn về tối đa `maxPoints` điểm (mặc định 300). Chỉ giữ dữ liệu 7 ngày (BR-13).
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: ['1h', '24h'], default: '1h' }
        - name: maxPoints
          in: query
          schema: { type: integer, minimum: 10, maximum: 1000, default: 300 }
      responses:
        '200':
          description: Chuỗi điểm số liệu theo thời gian tăng dần.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingSeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===================== THRESHOLDS =====================
  /rooms/{roomId}/threshold:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Thresholds]
      operationId: getRoomThreshold
      summary: Xem ngưỡng và trạng thái từng chỉ số (FR-37) — STAFF
      description: Phòng chưa đặt ngưỡng → các `min`/`max` là `null` (không cảnh báo).
      responses:
        '200':
          description: Ngưỡng hiện tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Threshold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Thresholds]
      operationId: setRoomThreshold
      summary: Đặt ngưỡng cảnh báo (FR-37, BR-12) — STAFF
      description: |
        Mỗi chỉ số cần `min < max`. Cảnh báo chỉ phát sau **N lần đọc liên tiếp** vượt ngưỡng (mặc định N = 3)
        và chỉ **một lần** cho mỗi lần chuyển `NORMAL → ABNORMAL`; về lại khoảng bình thường N lần liên tiếp thì reset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThresholdInput' }
      responses:
        '200':
          description: Ngưỡng sau cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Threshold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== IOT (DEVICE INTERFACE) =====================
  /iot/devices/{deviceId}/telemetry:
    servers:
      - url: http://localhost:8080
        description: Qua Gateway, đường dẫn /iot giữ nguyên
    parameters:
      - $ref: '#/components/parameters/IotDeviceId'
    post:
      tags: [IoT]
      operationId: postTelemetry
      summary: Thiết bị gửi nhiệt độ / độ ẩm (FR-32, UC-11)
      description: |
        Dành cho **cảm biến**. Xác thực bằng `X-Device-Key`. Hệ thống lấy thời điểm theo **giờ máy chủ** (không tin giờ thiết bị),
        cập nhật `lastSeen` + `ONLINE`, kiểm tra ngưỡng. Giá trị ngoài khoảng làm việc của DHT22
        (nhiệt độ -40..80 °C, độ ẩm 0..100 %) → `422`, không lưu (BR-10). Thiết bị `INACTIVE` → `403`.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryRequest' }
      responses:
        '200':
          description: Đã nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /iot/devices/{deviceId}/snapshot:
    servers:
      - url: http://localhost:8080
        description: Qua Gateway, đường dẫn /iot giữ nguyên
    parameters:
      - $ref: '#/components/parameters/IotDeviceId'
    post:
      tags: [IoT]
      operationId: postSnapshot
      summary: Thiết bị gửi ảnh snapshot (FR-30, UC-10)
      description: |
        Dành cho **camera** (Camera Agent). Xác thực `X-Device-Key` **trước** khi nhận ảnh. Chỉ `image/jpeg`, tối đa **2 MB**
        (BR-10): quá lớn → `413`, sai định dạng → `415`. Ảnh mới nhất giữ trong RAM để phục vụ ngay; cứ 60 giây
        (và khi camera chuyển OFFLINE) ghi bền vào DB, ghi đè ảnh cũ (FR-31).
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SnapshotUpload' }
      responses:
        '204': { description: Đã nhận. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Ảnh vượt 2 MB (`PAYLOAD_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Không phải JPEG (`UNSUPPORTED_MEDIA_TYPE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /iot/devices/{deviceId}/commands:
    servers:
      - url: http://localhost:8080
        description: Qua Gateway, đường dẫn /iot giữ nguyên
    parameters:
      - $ref: '#/components/parameters/IotDeviceId'
    get:
      tags: [IoT]
      operationId: pollCommands
      summary: Thiết bị hỏi lệnh điều khiển (FR-41, mức C)
      description: Chỉ làm nếu còn thời gian. Hiện trả danh sách rỗng.
      security:
        - deviceKey: []
      responses:
        '200':
          description: Lệnh đang chờ.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: API key của thiết bị, sinh khi đăng ký thiết bị.
  parameters:
    Page: { $ref: './common.yaml#/components/parameters/Page' }
    Limit: { $ref: './common.yaml#/components/parameters/Limit' }
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IotDeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoomId:
      name: roomId
      in: path
      required: true
      description: Mã phòng của Core Service (lấy từ `/my-trays` hoặc `/rooms` của Core).
      schema: { type: string, format: uuid }
  responses:
    BadRequest: { $ref: './common.yaml#/components/responses/BadRequest' }
    Unauthorized: { $ref: './common.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './common.yaml#/components/responses/Forbidden' }
    NotFound: { $ref: './common.yaml#/components/responses/NotFound' }
    Conflict: { $ref: './common.yaml#/components/responses/Conflict' }
    ValidationError: { $ref: './common.yaml#/components/responses/ValidationError' }
    ServiceUnavailable: { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  schemas:
    Error: { $ref: './common.yaml#/components/schemas/Error' }
    PageMeta: { $ref: './common.yaml#/components/schemas/PageMeta' }
    DeviceType: { type: string, enum: [CAMERA, SENSOR] }
    DeviceStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    ConnectionState: { type: string, enum: [ONLINE, OFFLINE] }
    MetricState:
      type: string
      enum: [NORMAL, ABNORMAL]
      description: Trạng thái từng chỉ số sau khi áp dụng quy tắc N lần liên tiếp (BR-12).
    Device:
      type: object
      required: [id, roomId, type, name, intervalSec, isSimulated, status, connectionState]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DeviceType' }
        name: { type: string, example: Camera phòng A1 }
        intervalSec:
          { type: integer, minimum: 1, example: 10, description: Chu kỳ gửi dữ liệu (giây). }
        isSimulated: { type: boolean }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        lastSeen: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    DeviceList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Device' }
    CreateDeviceRequest:
      type: object
      required: [roomId, type, name, intervalSec]
      properties:
        roomId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DeviceType' }
        name: { type: string, minLength: 1, maxLength: 100 }
        intervalSec: { type: integer, minimum: 1, maximum: 3600, example: 10 }
        isSimulated: { type: boolean, default: true }
    CreateDeviceResponse:
      type: object
      required: [device, apiKey]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        apiKey:
          type: string
          description: Plaintext, **chỉ hiện một lần**. Lưu vào cấu hình thiết bị ngay.
          example: dk_live_3f9c1b7e2a8d4c6f9b0e1a2d3c4b5a69
    UpdateDeviceRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        intervalSec: { type: integer, minimum: 1, maximum: 3600 }
    RotateKeyResponse:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string }
    DeviceSummary:
      type: object
      properties:
        sensors:
          type: object
          properties:
            online: { type: integer }
            offline: { type: integer }
        cameras:
          type: object
          properties:
            online: { type: integer }
            offline: { type: integer }
    CameraInfo:
      type: object
      required: [roomId, deviceId, connectionState, isSimulated, hasSnapshot]
      properties:
        roomId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        isSimulated: { type: boolean }
        hasSnapshot: { type: boolean }
        capturedAt: { type: string, format: date-time, nullable: true }
        lastSeen: { type: string, format: date-time, nullable: true }
        intervalSec: { type: integer, example: 10, description: Gợi ý chu kỳ làm mới cho client. }
    Reading:
      type: object
      required: [temperature, humidity, recordedAt]
      properties:
        temperature: { type: number, format: double, example: 27.5, description: °C }
        humidity: { type: number, format: double, example: 86.2, description: '%' }
        recordedAt: { type: string, format: date-time, description: Giờ máy chủ. }
    SensorLatest:
      type: object
      required: [roomId, connectionState, isSimulated]
      properties:
        roomId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, nullable: true }
        connectionState: { $ref: '#/components/schemas/ConnectionState' }
        isSimulated: { type: boolean }
        reading:
          allOf: [{ $ref: '#/components/schemas/Reading' }]
          nullable: true
        temperatureState: { $ref: '#/components/schemas/MetricState' }
        humidityState: { $ref: '#/components/schemas/MetricState' }
    ReadingSeries:
      type: object
      required: [roomId, range, points]
      properties:
        roomId: { type: string, format: uuid }
        range: { type: string, enum: ['1h', '24h'] }
        points:
          type: array
          items: { $ref: '#/components/schemas/Reading' }
    Range:
      type: object
      required: [min, max]
      properties:
        min: { type: number, format: double, nullable: true, example: 22 }
        max: { type: number, format: double, nullable: true, example: 30 }
    RangeWithState:
      allOf:
        - $ref: '#/components/schemas/Range'
        - type: object
          properties:
            state: { $ref: '#/components/schemas/MetricState' }
    Threshold:
      type: object
      required: [roomId, temperature, humidity, consecutiveCount]
      properties:
        roomId: { type: string, format: uuid }
        temperature: { $ref: '#/components/schemas/RangeWithState' }
        humidity: { $ref: '#/components/schemas/RangeWithState' }
        consecutiveCount:
          { type: integer, minimum: 1, example: 3, description: Số lần đọc liên tiếp (N). }
    ThresholdInput:
      type: object
      required: [temperature, humidity]
      properties:
        temperature:
          allOf: [{ $ref: '#/components/schemas/Range' }]
          description: Cần `min < max`.
        humidity:
          allOf: [{ $ref: '#/components/schemas/Range' }]
          description: Cần `min < max`, trong khoảng 0..100.
        consecutiveCount: { type: integer, minimum: 1, maximum: 20, default: 3 }
    TelemetryRequest:
      type: object
      required: [temperature, humidity]
      properties:
        temperature: { type: number, format: double, minimum: -40, maximum: 80, example: 28.4 }
        humidity: { type: number, format: double, minimum: 0, maximum: 100, example: 84.1 }
    TelemetryResponse:
      type: object
      required: [recordedAt]
      properties:
        recordedAt: { type: string, format: date-time }
    SnapshotUpload:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: Ảnh JPEG, tối đa 2 MB.
