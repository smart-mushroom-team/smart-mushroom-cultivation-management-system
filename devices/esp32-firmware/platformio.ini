; Firmware cảm biến phòng nấm cho ESP32 DevKit (ESP32-WROOM-32)
; Mở thư mục này bằng VS Code + PlatformIO, bấm Upload (mũi tên ->) để nạp.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Nếu nạp hay lỗi "Failed to connect", đổi upload_speed thành 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10
