name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, identity, core, monitoring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest -r services/${{ matrix.service }}/requirements.txt
      - run: ruff check libs services
      - run: PYTHONPATH=../../libs python -m pytest -q
        working-directory: services/${{ matrix.service }}
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
