name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, identity, core, monitoring]
    services:                      # DB thật cho test tích hợp của Core (chạy trong schema tạm)
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_USER: ci, POSTGRES_DB: ci_db }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_NAME: ci_db
      JWT_SECRET: ci-secret-ci-secret-ci-secret-123
      SERVICE_KEY: ci-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest -r services/${{ matrix.service }}/requirements.txt
      - run: ruff check libs services
      - run: PYTHONPATH=../../libs/common:. python -m pytest -q
        working-directory: services/${{ matrix.service }}
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
