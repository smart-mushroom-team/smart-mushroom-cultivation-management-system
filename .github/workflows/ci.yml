name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret
      SERVICE_KEY: ci-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install dependencies
        run: npm install
      - run: npm ci
      - name: Sinh Prisma Client
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Kiểm tra format
        run: npm run format:check
      - name: Kiểm tra OpenAPI
        run: npm run openapi:validate
      - name: Test
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Tạo .env từ mẫu
        run: cp .env.example .env
      - name: Build image các service
        run: docker compose build
