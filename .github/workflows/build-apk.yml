# Build file APK của app khách hàng (Flutter) ngay trên GitHub, không cần cài Flutter/Android Studio trên máy.
# Tải APK: tab Actions -> chọn lần chạy "build-apk" -> mục Artifacts -> "trai-nam-apk" (file zip chứa .apk).
#
# Chạy tự động khi đẩy code có thay đổi trong clients/mobile/ (dùng địa chỉ mặc định bên dưới),
# hoặc chạy tay: Actions -> build-apk -> Run workflow, nhập địa chỉ server khác nếu cần.
name: build-apk

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Địa chỉ server mà app gọi (ghi cứng vào APK). 192.168.137.1 = laptop đang bật Mobile hotspot"
        required: true
        default: "http://192.168.137.1:8000"
  push:
    paths:
      - "clients/mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: clients/mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://192.168.137.1:8000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dọn file riêng của máy dev (đường dẫn SDK Windows, cache Gradle)
        run: rm -rf android/.gradle android/local.properties

      - name: Kiểm tra AndroidManifest có quyền mạng
        run: |
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$m" || { echo "::error file=clients/mobile/$m::Thiếu quyền INTERNET: APK release sẽ không gọi được server"; exit 1; }
          grep -q 'usesCleartextTraffic="true"' "$m" || { echo "::error file=clients/mobile/$m::Thiếu android:usesCleartextTraffic=\"true\": Android chặn kết nối HTTP tới server"; exit 1; }

      - run: flutter --version
      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Đặt tên file theo địa chỉ server
        run: |
          mkdir -p dist
          tag=$(printf '%s' "$API_BASE_URL" | sed -E 's#^https?://##; s#[^A-Za-z0-9.]+#_#g; s#_+$##')
          cp build/app/outputs/flutter-apk/app-release.apk "dist/trai-nam-${tag}.apk"
          ls -la dist
          echo "### APK đã build xong" >> "$GITHUB_STEP_SUMMARY"
          echo "- Địa chỉ server trong app: \`$API_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tải ở mục **Artifacts** bên dưới: \`trai-nam-apk\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: trai-nam-apk
          path: clients/mobile/dist/*.apk
          retention-days: 30
          if-no-files-found: error
